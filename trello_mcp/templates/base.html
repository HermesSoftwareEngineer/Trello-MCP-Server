<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trello MCP Server{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #dfe3e8;
      --text: #1a1d21;
      --muted: #5c6470;
      --accent: #0c66e4;
      --accent-text: #ffffff;
      --danger-bg: #ffecec;
      --danger-border: #f5a3a3;
      --danger-text: #9c1f1f;
      --ok-bg: #e8f7ee;
      --ok-border: #9fd8b6;
      --ok-text: #1a6b3c;
      --code-bg: #f1f3f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16191d;
        --surface: #1f2328;
        --border: #343a41;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --accent: #4c9aff;
        --accent-text: #10151a;
        --danger-bg: #3a2224;
        --danger-border: #6b3538;
        --danger-text: #ffb4b4;
        --ok-bg: #1d3226;
        --ok-border: #35603f;
        --ok-text: #9fe0b6;
        --code-bg: #14171a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2.5rem 1.25rem 4rem;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.05rem; margin: 0 0 .75rem; }
    .sub { color: var(--muted); margin: 0 0 2rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .35rem; }
    .hint { color: var(--muted); font-size: .85rem; font-weight: 400; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: .6rem .7rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: .95rem;
    }
    button {
      background: var(--accent);
      color: var(--accent-text);
      border: 0;
      border-radius: 6px;
      padding: .6rem 1.1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    code, pre {
      background: var(--code-bg);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .85rem;
    }
    code { padding: .15em .4em; }
    pre { padding: .9rem; overflow-x: auto; border: 1px solid var(--border); }
    .alert { padding: .8rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: .92rem; }
    .alert.error { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-text); }
    .alert.ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok-text); }
    ol { padding-left: 1.2rem; }
    li { margin-bottom: .4rem; }
    a { color: var(--accent); }
    details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
    .token-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .9rem;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .9rem;
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
